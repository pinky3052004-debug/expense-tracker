name: monthly-backup

on:
  schedule:
    - cron: '0 3 1 * *'      # လတိုင်း ၁ ရက် 03:00 UTC (GitHub က မိနစ်အနည်းငယ် နောက်ကျတတ်တယ်)
  workflow_dispatch:          # Actions tab ကနေ ကိုယ်တိုင် run လို့ရ

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backup/requirements.txt
      - run: pip install -r backup/requirements.txt
      - run: python backup/backup.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
